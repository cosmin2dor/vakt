openapi: 3.0.3

info:
  title: Vakt API
  version: "1"
  description: >
    The full v1 API contract (SDD.md §4, M1 summary: "The shape freezes
    here; the scheduler that populates it arrives in M3."). The Task DTO
    below carries only derived fields — next fire, schedule summary,
    effective suppression state — never raw directive text a client
    would have to parse or evaluate against "now" (CLAUDE.md: "the
    backend is the only parser"). The shape is authored in M1, ahead of
    the scheduler (M3) and dashboard (M4) that populate and consume it,
    so that the frontend can be built against a mock server generated
    from this spec in parallel with the backend milestones (SDD.md §7).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.txt

servers:
  - url: /api/v1

# No auth: PRD.md §8 assumes a private home network with no multi-user
# roles, and SDD.md §1 doesn't revisit that for v1. Explicit rather than
# an oversight — see CLAUDE.md concerns raised on the mkcert TLS fallback.
security: []

paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List every task in the vault.
      description: >
        The whole vault, unfiltered and unpaginated (SDD.md §1, "Data
        volume": "fetch the whole vault, filter in the client — no
        server-side filtering or pagination. A household vault is small").
        Ordering, grouping (overdue / today / upcoming / triggered per
        UX.md §6.1), and any filtering happen client-side.
      tags: [tasks]
      responses:
        "200":
          description: Every known task, in no particular order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createTask
      summary: Create a new task.
      description: >
        Appends a new task line to the given file. The id is
        server-generated from the title slug, with a numeric suffix on
        collision (SDD.md G5) — it is never client-supplied.
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: The request body is missing a required field, or names both @schedule and @once (or neither).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Fetch a single task by id.
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}/fulfill:
    post:
      operationId: fulfillTask
      summary: Record that a task's real-world obligation was completed.
      description: >
        Fulfillment is independent of dispatch (PRD.md §1, "Decoupled
        Execution & Fulfillment"; §2). A one-time task (@once) moves to
        @state(completed) and its checkbox is marked done; a recurring
        task (@schedule) is stamped @last_completed(NOW) and stays
        scheduled for its next cycle (PRD.md §5.1). Fulfilling before
        the next scheduled fire point bypasses exactly that one trigger
        (SDD.md G8).
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}/pause:
    post:
      operationId: pauseTask
      summary: Suspend a task's scheduler evaluation.
      description: >
        Sets @state(paused). Bypassed by the scheduler until resumed
        (PRD.md §5.3, SDD.md State reference). One of the task card's
        quick actions (UX.md §6, "Quick Actions").
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  description: Recorded as @reason.
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}/resume:
    post:
      operationId: resumeTask
      summary: Return a paused task to active evaluation.
      description: >
        Sets @state(active). The counterpart quick action to pause
        (UX.md §6.1, "Pause/Resume").
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}/skip:
    post:
      operationId: skipTask
      summary: Bypass upcoming schedule triggers.
      description: >
        Increments @skip_count by the given count (default 1), per
        PRD.md §5.2. UX.md §6.1's "Skip Next" quick action calls this
        with the default count.
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        "200":
          description: The task, updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /tasks/{id}/trigger:
    post:
      operationId: triggerTask
      summary: Dispatch a task's outbound trigger immediately.
      description: >
        Resolves the task by id, dispatches it through the integration
        module registry, and returns the outcome. Does not write back to
        the vault — no @last_triggered stamp. The surgical patcher and
        writeback orchestration are M2/M3 work; this endpoint exists to
        prove the dispatch path in M1.
      tags: [tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
      responses:
        "200":
          description: The task was resolved and dispatch was attempted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerOutcome"
        "404":
          description: No task with this id is known to the index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /subscriptions:
    post:
      operationId: createSubscription
      summary: Enrol a push subscription.
      description: >
        Stores a Web Push subscription object as returned by
        `PushSubscription.toJSON()` in the browser. Persisted to the
        /config volume, never to the vault (SDD.md §2.3).
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscription"
      responses:
        "201":
          description: The subscription was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          description: The subscription object is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /subscriptions/unsubscribe:
    post:
      operationId: deleteSubscription
      summary: Remove a push subscription.
      description: >
        Identified by endpoint URL rather than a synthetic id — a push
        subscription's endpoint is already its unique key (SDD.md G14:
        the same pruning a 404/410 from the push service triggers).
      tags: [subscriptions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        "204":
          description: The subscription was removed, or was already absent.
        "400":
          description: The request body is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /directives:
    get:
      operationId: listDirectives
      summary: List every directive the daemon recognizes.
      description: >
        The runtime directive registry (schema/directives.yaml, generated
        into model.Directives), served so the Smart Editor's autocomplete
        and helpers never drift ahead of what the daemon actually parses
        (SDD.md §2.5).
      tags: [directives]
      responses:
        "200":
          description: Every registered directive descriptor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Directive"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /vapid-public-key:
    get:
      operationId: getVapidPublicKey
      summary: Fetch the VAPID public key for push enrolment.
      description: >
        Base64url-encoded, suitable as `applicationServerKey` in
        `PushManager.subscribe()`. The keypair lives on the /config
        volume and survives restarts (SDD.md §2.3).
      tags: [subscriptions]
      responses:
        "200":
          description: The current VAPID public key.
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key:
                    type: string
        "404":
          description: No VAPID keypair has been provisioned on /config yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /directories:
    get:
      operationId: listDirectories
      summary: Inspect the vault's directory structure.
      description: >
        Returns the whole vault as one tree, rooted at the vault root
        (FR-2.3; UX.md §6.1 "Vault Directory", §6 "Vault browser"). No
        depth or path parameter — SDD.md §1's "fetch the whole vault,
        filter in the client" applies here too; the browser expands and
        collapses the tree client-side (UX.md §6, `Collapsible`).
      tags: [vault]
      responses:
        "200":
          description: The root directory entry, with nested children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryEntry"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /files:
    get:
      operationId: getFile
      summary: Fetch a single vault file's raw content.
      description: >
        Backs the vault browser's file view (UX.md §6.1) and, later, the
        Smart Editor's read path (full editor semantics are M5). Returns
        the file's raw Markdown byte-for-byte; this endpoint does not
        parse it — that is what `/tasks` and (per CLAUDE.md) `/parse`
        are for. `path` is a query parameter rather than a path segment
        because vault paths contain `/` themselves.
      tags: [vault]
      parameters:
        - name: path
          in: query
          required: true
          description: Path relative to the vault root, e.g. Household/Routines.md.
          schema:
            type: string
      responses:
        "200":
          description: The file's content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "404":
          description: No file exists at this path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /events:
    get:
      operationId: streamEvents
      summary: Subscribe to real-time vault change events.
      description: >
        A server-sent events stream (FR-2.2): "Expose a real-time event
        stream to push file modification events to connected PWAs."
        Each SSE `data:` line is one JSON-encoded EventEnvelope. The
        cycle that produces these events is SDD.md §2.2's reactive
        cycle — a vault write reaches the index, and the index change is
        pushed here to every connected client.
      tags: [events]
      responses:
        "200":
          description: >
            An open text/event-stream connection. Each event's `data:`
            payload conforms to EventEnvelope.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventEnvelope"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  responses:
    UnexpectedError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TaskId:
      type: string
      description: Unique across the whole vault (SDD.md G1, G3).
      pattern: "^[a-z0-9_-]{1,64}$"

    TaskState:
      type: string
      description: >
        The five values PRD.md §3.2 and schema/directives.yaml's @state
        directive define (SDD.md §3, State reference).
      enum: [active, triggered, paused, completed, failed]

    Directive:
      type: object
      description: >
        One schema/directives.yaml entry, as generated into
        model.Directives (SDD.md §2.5). Mirrors that file's own field
        reference comment.
      required:
        - name
        - value_type
        - arity
        - required
        - system_written
      properties:
        name:
          type: string
          description: The @directive name, without the @ or parens.
        value_type:
          type: string
          description: string | enum | cron | datetime | integer.
        values:
          type: array
          nullable: true
          items:
            type: string
          description: "Only present for a closed enum: its fixed value list."
        pattern:
          type: string
          nullable: true
          description: >
            Only present when the value is further constrained beyond
            its type (e.g. @id's charset).
        arity:
          type: integer
          description: Positional values inside the directive's parentheses.
        required:
          type: boolean
          description: Whether a valid task line must carry this directive.
        system_written:
          type: boolean
          description: True only for directives the daemon alone ever writes.
        ui_helper:
          type: string
          nullable: true
          description: Which contextual helper the Smart Editor opens.

    EffectiveSuppression:
      type: object
      description: >
        SDD.md G7's suppression ladder, collapsed to the one answer that
        holds right now — never the ladder itself, and never the raw
        @skip_until / @last_completed / @skip_count values the client
        would otherwise have to evaluate against "now" (CLAUDE.md: the
        backend is the only parser). Recomputed on every fetch and
        every SSE update.
      required: [suppressed, reason]
      properties:
        suppressed:
          type: boolean
          description: Whether the next scheduled fire point will be bypassed.
        reason:
          type: string
          nullable: true
          description: >
            Which rung of the G7 ladder is currently suppressing the
            task; null when suppressed is false.
          enum:
            - state_not_active
            - skip_until
            - early_completion
            - skip_count

    Task:
      type: object
      description: >
        The full task representation. Every field here is a value the
        client can render as-is — no cron, no date-time evaluated
        against "now", no raw directive text (SDD.md §4, M1 "On schema
        depth"; UX.md §6, task card anatomy).
      required:
        - id
        - title
        - file_path
        - state
        - next_fire
        - schedule_summary
        - effective_suppression
        - last_triggered
        - last_completed
        - reason
        - target
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
          description: The task line's title text (UX.md §6, card anatomy).
        file_path:
          type: string
          description: >
            Path relative to the vault root (UX.md §6, card anatomy:
            "@dog_feed · /Household/Routines.md").
        state:
          $ref: "#/components/schemas/TaskState"
        next_fire:
          type: string
          format: date-time
          nullable: true
          description: >
            The next computed fire point, or null when the task has no
            valid schedule or cannot fire again — paused, completed,
            failed, or an @once already elapsed (SDD.md G11). Computed
            server-side from @schedule/@once (UX.md §6, card anatomy:
            "in 2h 14m" is rendered client-side as a diff against this
            timestamp — the client does no cron evaluation, only date
            arithmetic on a value the server already resolved).
        schedule_summary:
          type: string
          nullable: true
          description: >
            A human-readable rendering of @schedule or @once, e.g.
            "Daily at 08:00" or "Once, Mar 3 2026 09:00" — never the raw
            cron expression or ISO timestamp a client would have to
            interpret itself.
        effective_suppression:
          $ref: "#/components/schemas/EffectiveSuppression"
        last_triggered:
          type: string
          format: date-time
          nullable: true
          description: PRD.md §2.3 — when the reminder was last dispatched.
        last_completed:
          type: string
          format: date-time
          nullable: true
          description: PRD.md §2.3 — when fulfillment was last recorded.
        reason:
          type: string
          nullable: true
          description: >
            The @reason directive — why a task is paused, skipped, or
            failed (PRD.md §3.2; SDD.md G13).
        target:
          type: string
          nullable: true
          description: >
            The integration module this task dispatches to, e.g.
            ios_notifications (PRD.md §4.1).

    TaskCreate:
      type: object
      description: >
        FR-2.1's create path. The id is never accepted here — it is
        always server-generated from the title slug (SDD.md G5).
      required: [title, file_path]
      properties:
        title:
          type: string
        file_path:
          type: string
          description: Vault-relative path of the file to append the new task line to.
        schedule:
          type: string
          nullable: true
          description: A cron expression. Mutually exclusive with once.
        once:
          type: string
          format: date-time
          nullable: true
          description: An ISO timestamp. Mutually exclusive with schedule.
        target:
          type: string
          nullable: true

    Diagnostic:
      type: object
      description: >
        A parse-time problem raised against a specific line (SDD.md G3,
        G4, G5, G12; G15: "the diagnostic surfaces in the UI"). Severity
        follows the language SDD.md itself uses per gap — "raises an
        error diagnostic" for G3/G4, "raises a warning diagnostic" for
        G5/G12.
      required: [severity, message, file_path, line, code, task_id]
      properties:
        severity:
          type: string
          enum: [warning, error]
        message:
          type: string
          description: Human-readable explanation, shown as-is in the UI.
        file_path:
          type: string
        line:
          type: integer
          description: 1-based line number the diagnostic applies to.
        code:
          type: string
          nullable: true
          description: >
            A machine-readable classification, e.g. duplicate_id,
            invalid_id, missing_id, unknown_payload_variable. Not a
            closed enum — the registry-driven directive set can grow
            new diagnostic codes without a contract change.
        task_id:
          $ref: "#/components/schemas/TaskId"
          nullable: true
          description: >
            The task this diagnostic concerns, when one could be
            resolved (e.g. null for a duplicate @id's later, unscheduled
            occurrence).

    EventEnvelope:
      type: object
      description: >
        One SSE `data:` payload (FR-2.2; SDD.md §2.2's reactive cycle).
        `type` discriminates which of the optional fields is populated.
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum:
            - task_upserted
            - task_removed
            - diagnostic_raised
            - diagnostic_cleared
            - heartbeat
          description: >
            task_upserted: a task was created or its derived fields
            changed — task is populated. task_removed: a task left the
            index (file deleted, @id removed, or superseded by a
            duplicate per G4) — task_id is populated. diagnostic_raised
            / diagnostic_cleared: a parse problem appeared or was
            resolved — diagnostic is populated. heartbeat: a periodic
            keep-alive with no payload, so a client can distinguish a
            silent-but-alive connection from a dropped one.
        timestamp:
          type: string
          format: date-time
        task:
          $ref: "#/components/schemas/Task"
          nullable: true
        task_id:
          $ref: "#/components/schemas/TaskId"
          nullable: true
        diagnostic:
          $ref: "#/components/schemas/Diagnostic"
          nullable: true

    DirectoryEntry:
      type: object
      description: One node of the vault's directory tree (FR-2.3).
      required: [name, path, type]
      properties:
        name:
          type: string
        path:
          type: string
          description: Vault-relative path.
        type:
          type: string
          enum: [file, directory]
        children:
          type: array
          nullable: true
          description: Present (possibly empty) only when type is directory.
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    FileContent:
      type: object
      description: A single vault file's raw content, unparsed.
      required: [path, content, size, modified_at]
      properties:
        path:
          type: string
        content:
          type: string
          description: The file's raw Markdown, byte-for-byte.
        size:
          type: integer
          description: Size in bytes.
        modified_at:
          type: string
          format: date-time
          nullable: true

    TriggerOutcome:
      type: object
      description: >
        What the integration module reported back, not a delivery
        receipt. "accepted" means the push service accepted the message
        for delivery — Web Push returns no delivery confirmation
        (SDD.md §3, state reference).
      required: [task_id, target, dispatched_at, accepted]
      properties:
        task_id:
          $ref: "#/components/schemas/TaskId"
        target:
          type: string
          description: The integration module that handled dispatch, e.g. ios_notifications.
        dispatched_at:
          type: string
          format: date-time
        accepted:
          type: boolean
        detail:
          type: string
          nullable: true
          description: Human-readable outcome detail, e.g. a delivery error.

    PushSubscription:
      type: object
      description: The shape a browser's PushSubscription.toJSON() produces.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
        expirationTime:
          type: string
          format: date-time
          nullable: true
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true
              additionalProperties: true
