<!doctype html>
<!--
  UX.md §2.2: Vakt ships one theme, dark, with no toggle. `class="dark"` is
  set permanently here (not conditionally, not via prefers-color-scheme) so
  that any copied shadcn component whose internals reach for a `dark:`
  utility resolves to the only branch that exists.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      UX.md §8: theme-color and status-bar-style must match --background
      (#0e0e11, from index.css's HSL triplet) everywhere the shell can flash,
      or a light-mode phone gets a white splash screen and status bar.
    -->
    <meta name="theme-color" content="#0e0e11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Vakt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
